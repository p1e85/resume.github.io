<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Procedural Platformer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
            background-color: #1a202c; /* dark blue-gray */
        }
        body {
            font-family: 'Press Start 2P', cursive;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .game-wrapper {
            position: relative;
            width: 100%;
            flex-grow: 1; /* Allow wrapper to fill space */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        canvas {
            background-color: #2d3748;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            aspect-ratio: 16 / 9;
        }
        .control-button {
            transition: all 0.1s ease;
            user-select: none;
            -webkit-user-select: none; /* Prevent text selection on taps */
        }
        .control-button:active {
            background-color: rgba(160, 174, 192, 0.7); /* gray-500 with opacity */
            transform: scale(0.95);
        }
        /* Hide mobile controls on large screens */
        @media (min-width: 1024px) {
            #mobile-controls {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Game Canvas Wrapper -->
    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="messageBox" class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-70 text-white text-2xl md:text-4xl hidden rounded-lg text-center p-4">
            <span id="winMessage">You Won!</span>
            <span id="distanceMessage" class="text-xl md:text-2xl mt-4"></span>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls" class="w-full flex justify-between items-center p-5 bg-gray-900 bg-opacity-80 z-10">
        <div class="flex gap-5">
            <button id="leftBtn" class="control-button bg-gray-700 bg-opacity-50 text-white font-bold p-4 rounded-full w-24 h-24 text-5xl flex items-center justify-center">&#x2190;</button>
            <button id="rightBtn" class="control-button bg-gray-700 bg-opacity-50 text-white font-bold p-4 rounded-full w-24 h-24 text-5xl flex items-center justify-center">&#x2192;</button>
        </div>
        <button id="jumpBtn" class="control-button bg-gray-700 bg-opacity-50 text-white font-bold p-4 rounded-full w-24 h-24 text-5xl flex items-center justify-center">&#x2191;</button>
    </div>


    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('messageBox');
        const winMessage = document.getElementById('winMessage');
        const distanceMessage = document.getElementById('distanceMessage');

        let gameRunning = true;
        const WINNING_DISTANCE = 10000;

        // Game settings
        const gravity = 0.6;
        let player, platforms, keys, scrollOffset;

        // Image objects
        const playerImage = new Image();
        const platformImage = new Image();
        const backgroundImage = new Image();

        // Default "Art" as base64 SVGs to avoid external requests
        const defaultPlayerSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#4299e1"/><circle cx="30" cy="30" r="10" fill="white"/><circle cx="70" cy="30" r="10" fill="white"/><rect x="20" y="60" width="60" height="10" fill="white" rx="5"/></svg>`;
        const defaultPlatformSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50"><rect width="200" height="50" fill="#a0aec0" rx="10"/></svg>`;
        const defaultBackgroundSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect width="800" height="600" fill="#2d3748"/><circle cx="700" cy="100" r="50" fill="#f6e05e"/></svg>`;

        playerImage.src = 'data:image/svg+xml;base64,' + btoa(defaultPlayerSVG);
        platformImage.src = 'data:image/svg+xml;base64,' + btoa(defaultPlatformSVG);
        backgroundImage.src = 'data:image/svg+xml;base64,' + btoa(defaultBackgroundSVG);
        
        class Player {
            constructor() {
                this.position = { x: 100, y: 100 };
                this.velocity = { x: 0, y: 0 };
                this.width = 50;
                this.height = 50;
                this.jumpStrength = 15;
                this.onGround = false;
            }

            draw() {
                ctx.drawImage(playerImage, this.position.x, this.position.y, this.width, this.height);
            }

            update() {
                this.draw();
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                if (this.position.y + this.height + this.velocity.y <= canvas.height) {
                    this.velocity.y += gravity;
                } else {
                    this.velocity.y = 0;
                    this.position.y = canvas.height - this.height;
                    this.onGround = true;
                }
                
                if (this.position.x < 0) {
                    this.position.x = 0;
                }
                
                // If player falls off the bottom of the screen, reset the game.
                if (this.position.y > canvas.height) {
                    loseGame();
                }
            }
        }

        class Platform {
            constructor({ x, y, width, height }) {
                this.position = { x, y };
                this.width = width;
                this.height = height;
            }

            draw() {
                ctx.drawImage(platformImage, this.position.x, this.position.y, this.width, this.height);
            }
        }
        
        function generatePlatform(lastPlatform) {
            const MIN_GAP = 80;
            const MAX_GAP = 200;
            const MAX_Y_CHANGE = 100;
            const MIN_WIDTH = 150;
            const MAX_WIDTH = 300;

            const newX = lastPlatform.position.x + lastPlatform.width + MIN_GAP + Math.random() * (MAX_GAP - MIN_GAP);
            let newY = lastPlatform.position.y + (Math.random() - 0.5) * MAX_Y_CHANGE * 2;
            
            // Clamp Y to be within screen bounds
            if (newY > canvas.height - 50) newY = canvas.height - 50;
            if (newY < 200) newY = 200;

            const newWidth = MIN_WIDTH + Math.random() * (MAX_WIDTH - MIN_WIDTH);
            
            platforms.push(new Platform({ x: newX, y: newY, width: newWidth, height: 20 }));
        }

        function init() {
            gameRunning = true;
            scrollOffset = 0;
            messageBox.classList.add('hidden');
            
            player = new Player();
            platforms = [
                new Platform({ x: 0, y: canvas.height - 60, width: 600, height: 60 }),
            ];
            
            // Generate initial platforms to fill the screen
            while(platforms[platforms.length - 1].position.x < canvas.width) {
                 generatePlatform(platforms[platforms.length - 1]);
            }

            keys = {
                right: { pressed: false },
                left: { pressed: false },
            };
            
            if (!gameRunning) {
                animate();
            }
        }

        function animate() {
            if (!gameRunning) return;
            requestAnimationFrame(animate);

            ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'white';
            ctx.font = '20px "Press Start 2P"';
            ctx.fillText(`Distance: ${Math.floor(scrollOffset)}`, 20, 40);


            platforms.forEach(platform => {
                platform.draw();
            });
            player.update();

            // Scrolling and player movement
            if (keys.right.pressed && player.position.x < 400) {
                player.velocity.x = 5;
            } else if (keys.left.pressed && player.position.x > 100) {
                player.velocity.x = -5;
            } else {
                player.velocity.x = 0;
                if (keys.right.pressed) {
                    scrollOffset += 5;
                    platforms.forEach(platform => {
                        platform.position.x -= 5;
                    });
                } else if (keys.left.pressed && scrollOffset > 0) {
                    scrollOffset -= 5;
                     platforms.forEach(platform => {
                        platform.position.x += 5;
                    });
                }
            }

            // Platform collision detection
            player.onGround = false;
            platforms.forEach(platform => {
                if (
                    player.position.y + player.height <= platform.position.y &&
                    player.position.y + player.height + player.velocity.y >= platform.position.y &&
                    player.position.x + player.width >= platform.position.x &&
                    player.position.x <= platform.position.x + platform.width
                ) {
                    player.velocity.y = 0;
                    player.position.y = platform.position.y - player.height;
                    player.onGround = true;
                }
            });
            
            // Procedurally add and remove platforms
            const lastPlatform = platforms[platforms.length - 1];
            if (lastPlatform.position.x + lastPlatform.width < canvas.width + 200) {
                generatePlatform(lastPlatform);
            }
            
            platforms = platforms.filter(p => p.position.x + p.width > 0);
            
            // Win condition
            if(scrollOffset >= WINNING_DISTANCE) {
                winGame();
            }
        }
        
        function showWinScreen() {
            gameRunning = false;
            winMessage.textContent = 'You Survived!';
            distanceMessage.textContent = `Distance: ${Math.floor(scrollOffset)}`;
            messageBox.classList.remove('hidden');
            setTimeout(init, 3000); // Restart after 3 seconds
        }

        function winGame() {
            showWinScreen();
        }
        
        // This function is called when the player falls off the screen
        function loseGame() {
            // Instantly restart the game by calling the initialization function.
            init();
        }

        // --- Event listeners for controls ---

        window.addEventListener('keydown', ({ key }) => {
            switch (key) {
                case 'ArrowLeft': keys.left.pressed = true; break;
                case 'ArrowRight': keys.right.pressed = true; break;
                case 'ArrowUp': case ' ':
                    if (player.onGround) player.velocity.y = -player.jumpStrength;
                    break;
            }
        });

        window.addEventListener('keyup', ({ key }) => {
            switch (key) {
                case 'ArrowLeft': keys.left.pressed = false; break;
                case 'ArrowRight': keys.right.pressed = false; break;
            }
        });

        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const jumpBtn = document.getElementById('jumpBtn');

        function handleJump(e) {
             e.preventDefault();
             if (player.onGround) player.velocity.y = -player.jumpStrength;
        }
        
        function handleLeftPress(e) { e.preventDefault(); keys.left.pressed = true; }
        function handleLeftRelease(e) { e.preventDefault(); keys.left.pressed = false; }
        function handleRightPress(e) { e.preventDefault(); keys.right.pressed = true; }
        function handleRightRelease(e) { e.preventDefault(); keys.right.pressed = false; }

        leftBtn.addEventListener('mousedown', handleLeftPress);
        leftBtn.addEventListener('touchstart', handleLeftPress);
        leftBtn.addEventListener('mouseup', handleLeftRelease);
        leftBtn.addEventListener('touchend', handleLeftRelease);
        leftBtn.addEventListener('mouseleave', handleLeftRelease);

        rightBtn.addEventListener('mousedown', handleRightPress);
        rightBtn.addEventListener('touchstart', handleRightPress);
        rightBtn.addEventListener('mouseup', handleRightRelease);
        rightBtn.addEventListener('touchend', handleRightRelease);
        rightBtn.addEventListener('mouseleave', handleRightRelease);
        
        jumpBtn.addEventListener('mousedown', handleJump);
        jumpBtn.addEventListener('touchstart', handleJump);

        function setCanvasResolution() {
            canvas.width = 1280;
            canvas.height = 720;
            if(player) init();
        }
        
        window.onload = () => {
             setCanvasResolution();
             init();
             animate();
        }
        
        window.addEventListener('resize', setCanvasResolution);

    </script>
</body>
</html>
