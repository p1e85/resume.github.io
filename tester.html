<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Platformer Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
            background-color: #1a202c; /*
            dark blue-gray */
        }
        body {
            font-family: 'Press Start 2P', cursive;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .game-wrapper {
            position: relative;
            width: 100%;
            flex-grow: 1; /*
            Allow wrapper to fill space */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        canvas {
            background-color: #2d3748;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            aspect-ratio: 16 / 9;
        }
        .control-button {
            transition: all 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
            /*
            Prevent text selection on taps */
        }
        .control-button:active {
            background-color: rgba(160, 174, 192, 0.7); /*
            gray-500 with opacity */
            transform: scale(0.95);
        }
        /*
        Hide mobile controls on large screens */
        @media (min-width: 1024px) {
            #mobile-controls {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Game Canvas Wrapper -->
    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="messageBox" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-70 text-white text-2xl md:text-4xl hidden rounded-lg text-center p-4">
            You Won!
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls" class="w-full flex justify-between items-center p-5 bg-gray-900 bg-opacity-80 z-10">
        <div class="flex gap-5">
            <button id="leftBtn" class="control-button bg-gray-700 bg-opacity-50 text-white font-bold p-4 rounded-full w-24 h-24 text-5xl flex items-center justify-center">&#x2190;</button>
            <button id="rightBtn" class="control-button bg-gray-700 bg-opacity-50 text-white font-bold p-4 rounded-full w-24 h-24 text-5xl flex items-center justify-center">&#x2192;</button>
        </div>
        <button id="jumpBtn" class="control-button bg-gray-700 bg-opacity-50 text-white font-bold p-4 rounded-full w-24 h-24 text-5xl flex items-center justify-center">&#x2191;</button>
    </div>


    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('messageBox');

        let gameRunning = true;

        // Game settings
        const gravity = 0.6;
        let player, platforms, keys;

        // Image objects
        const playerImage = new Image();
        const platformImage = new Image();
        const winPlatformImage = new Image();
        const backgroundImage = new Image();

        // Default "Art" as base64 SVGs to avoid external requests
        const defaultPlayerSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#4299e1"/><circle cx="30" cy="30" r="10" fill="white"/><circle cx="70" cy="30" r="10" fill="white"/><rect x="20" y="60" width="60" height="10" fill="white" rx="5"/></svg>`;
        const defaultPlatformSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50"><rect width="200" height="50" fill="#a0aec0" rx="10"/></svg>`;
        const winPlatformSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50"><rect width="200" height="50" fill="#f6e05e" rx="10"/><path d="M100 5 L115 40 L70 18 H130 L85 40 Z" fill="#f687b3"/></svg>`;
        const defaultBackgroundSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect width="800" height="600" fill="#2d3748"/><circle cx="700" cy="100" r="50" fill="#f6e05e"/></svg>`;

        playerImage.src = 'data:image/svg+xml;base64,' + btoa(defaultPlayerSVG);
        platformImage.src = 'data:image/svg+xml;base64,' + btoa(defaultPlatformSVG);
        winPlatformImage.src = 'data:image/svg+xml;base64,' + btoa(winPlatformSVG);
        backgroundImage.src = 'data:image/svg+xml;base64,' + btoa(defaultBackgroundSVG);

        // Player Class
        class Player {
            constructor() {
                this.position = { x: 100, y: 100 };
                this.velocity = { x: 0, y: 0 };
                this.width = 50;
                this.height = 50;
                this.jumpStrength = 15;
                this.onGround = false;
            }

            draw() {
                ctx.drawImage(playerImage, this.position.x, this.position.y, this.width, this.height);
            }

            update() {
                this.draw();
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                if (this.position.y + this.height + this.velocity.y <= canvas.height) {
                    this.velocity.y += gravity;
                } else {
                    this.velocity.y = 0;
                    this.position.y = canvas.height - this.height;
                    this.onGround = true;
                }
                 // Prevent player from going off-screen horizontally
                if (this.position.x < 0) {
                    this.position.x = 0;
                }
                if (this.position.x + this.width > canvas.width) {
                    this.position.x = canvas.width - this.width;
                }
            }
        }

        // Platform Class
        class Platform {
            constructor({ x, y, width = 200, height = 20, isWinPlatform = false}) {
                this.position = { x, y };
                this.width = width;
                this.height = height;
                this.isWinPlatform = isWinPlatform;
            }

            draw() {
                const img = this.isWinPlatform ? winPlatformImage : platformImage;
                ctx.drawImage(img, this.position.x, this.position.y, this.width, this.height);
            }
        }
        
        // Game initialization
        function init() {
            gameRunning = true;
            messageBox.classList.add('hidden');
            
            player = new Player();
            platforms = [
                new Platform({ x: 0, y: canvas.height - 30, width: 300, height: 30 }),
                new Platform({ x: 200, y: canvas.height - 150 }),
                new Platform({ x: 500, y: canvas.height - 250 }),
                new Platform({ x: 850, y: canvas.height - 400 }),
                new Platform({ x: 500, y: canvas.height - 550, isWinPlatform: true }), // Win platform
            ];

            keys = {
                right: { pressed: false },
                left: { pressed: false },
            };
            
            if (!gameRunning) {
                animate();
            }
        }

        // Animation loop
        function animate() {
            if (!gameRunning) return;
            requestAnimationFrame(animate);

            // Draw background
            ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);

            platforms.forEach(platform => {
                platform.draw();
            });
            player.update();

            // Player movement
            if (keys.right.pressed && player.position.x < canvas.width - player.width) {
                player.velocity.x = 5;
            } else if (keys.left.pressed && player.position.x > 0) {
                player.velocity.x = -5;
            } else {
                player.velocity.x = 0;
            }

            // Platform collision detection
            player.onGround = false;
            platforms.forEach(platform => {
                if (
                    player.position.y + player.height <= platform.position.y &&
                    player.position.y + player.height + player.velocity.y >= platform.position.y &&
                    player.position.x + player.width >= platform.position.x &&
                    player.position.x <= platform.position.x + platform.width
                ) {
                    player.velocity.y = 0;
                    player.position.y = platform.position.y - player.height;
                    player.onGround = true;
                    if (platform.isWinPlatform) {
                       winGame();
                    }
                }
            });
        }
        
        function winGame() {
            gameRunning = false;
            messageBox.textContent = 'You Reached The Goal!';
            messageBox.classList.remove('hidden');
            setTimeout(init, 2000); // Restart after 2 seconds
        }

        // --- Event listeners for controls ---

        // Keyboard controls
        window.addEventListener('keydown', ({ key }) => {
            switch (key) {
                case 'ArrowLeft': keys.left.pressed = true; break;
                case 'ArrowRight': keys.right.pressed = true; break;
                case 'ArrowUp':
                case ' ': //
                Allow spacebar to jump
                    if (player.onGround) {
                        player.velocity.y = -player.jumpStrength;
                        player.onGround = false;
                    }
                    break;
            }
        });

        window.addEventListener('keyup', ({ key }) => {
            switch (key) {
                case 'ArrowLeft': keys.left.pressed = false; break;
                case 'ArrowRight': keys.right.pressed = false; break;
            }
        });

        // Mobile & Mouse Button Controls
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const jumpBtn = document.getElementById('jumpBtn');

        function handleJump(e) {
             e.preventDefault();
             if (player.onGround) {
                player.velocity.y = -player.jumpStrength;
                player.onGround = false;
            }
        }
        
        function handleLeftPress(e) { e.preventDefault(); keys.left.pressed = true; }
        function handleLeftRelease(e) { e.preventDefault(); keys.left.pressed = false; }
        function handleRightPress(e) { e.preventDefault(); keys.right.pressed = true; }
        function handleRightRelease(e) { e.preventDefault(); keys.right.pressed = false; }

        leftBtn.addEventListener('mousedown', handleLeftPress);
        leftBtn.addEventListener('touchstart', handleLeftPress);
        leftBtn.addEventListener('mouseup', handleLeftRelease);
        leftBtn.addEventListener('touchend', handleLeftRelease);
        leftBtn.addEventListener('mouseleave', handleLeftRelease); //
        Handle mouse leaving button area

        rightBtn.addEventListener('mousedown', handleRightPress);
        rightBtn.addEventListener('touchstart', handleRightPress);
        rightBtn.addEventListener('mouseup', handleRightRelease);
        rightBtn.addEventListener('touchend', handleRightRelease);
        rightBtn.addEventListener('mouseleave', handleRightRelease);
        
        jumpBtn.addEventListener('mousedown', handleJump);
        jumpBtn.addEventListener('touchstart', handleJump);

        
        // Set canvas internal resolution
        function setCanvasResolution() {
            canvas.width = 1280; // Render at a fixed resolution for consistency
            canvas.height = 720;
            // The CSS handles the display scaling
            
            // Re-initialize the game if it has already been running
            if(player) {
                init();
            }
        }
        
        // Initial setup on window load
        window.onload = () => {
             setCanvasResolution();
             init();
             animate();
        }
        
        // Also adjust on resize to handle orientation changes on mobile
        window.addEventListener('resize', setCanvasResolution);

    </script>
</body>
</html>
