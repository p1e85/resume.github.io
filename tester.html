<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vertical Procedural Platformer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
            background-color: #1a202c; /* dark blue-gray */
        }
        body {
            font-family: 'Press Start 2P', cursive;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .game-wrapper {
            position: relative;
            width: 100%;
            flex-grow: 1; /* Allow wrapper to fill available space */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem 1rem 0 1rem; /* Padding on sides and top */
        }
        canvas {
            background-color: #2d3748;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            aspect-ratio: 9 / 14; /* Taller aspect ratio for mobile */
        }
        #collectibles-bar {
            width: 100%;
            background-color: #2d3748;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 -5px 10px rgba(0,0,0,0.2);
            z-index: 5;
            font-size: 1.25rem;
        }
        .control-button {
            transition: all 0.1s ease;
            user-select: none;
            -webkit-user-select: none; /* Prevent text selection on taps */
        }
        .control-button:active {
            background-color: rgba(160, 174, 192, 0.7); /* gray-500 with opacity */
            transform: scale(0.95);
        }
        /* Hide mobile controls on large screens */
        @media (min-width: 1024px) {
            #mobile-controls {
                display: none;
            }
             #collectibles-bar {
                display: none;
            }
            canvas {
                aspect-ratio: 16 / 9; /* Revert to landscape for desktop */
            }
            .game-wrapper {
                 padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Game Canvas Wrapper -->
    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="messageBox" class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-70 text-white text-2xl md:text-4xl hidden rounded-lg text-center p-4">
            <span id="winMessage">You Won!</span>
            <span id="scoreMessage" class="text-xl md:text-2xl mt-4"></span>
        </div>
    </div>

    <!-- Collectibles Bar for Mobile -->
    <div id="collectibles-bar">
        <span class="text-yellow-400">Coins: <span id="coin-count">0</span></span>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls" class="w-full flex justify-between items-center p-5 bg-gray-900 bg-opacity-80 z-10">
        <div class="flex gap-5">
            <button id="leftBtn" class="control-button bg-gray-700 bg-opacity-50 text-white font-bold p-4 rounded-full w-24 h-24 text-5xl flex items-center justify-center">&#x2190;</button>
            <button id="rightBtn" class="control-button bg-gray-700 bg-opacity-50 text-white font-bold p-4 rounded-full w-24 h-24 text-5xl flex items-center justify-center">&#x2192;</button>
        </div>
        <button id="jumpBtn" class="control-button bg-gray-700 bg-opacity-50 text-white font-bold p-4 rounded-full w-24 h-24 text-5xl flex items-center justify-center">&#x2191;</button>
    </div>


    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('messageBox');
        const winMessage = document.getElementById('winMessage');
        const scoreMessage = document.getElementById('scoreMessage');
        const coinCountDisplay = document.getElementById('coin-count');

        let gameRunning = true;
        const WINNING_SCORE = 50;

        // Game settings
        const gravity = 0.7;
        let player, platforms, coins, keys, scrollOffset, score;

        // Image objects
        const playerImage = new Image();
        const platformImage = new Image();
        const coinImage = new Image();
        const backgroundImage = new Image();

        // Default "Art" as base64 SVGs
        const playerSVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#4299e1" rx="15"/><circle cx="30" cy="35" r="10" fill="white"/><circle cx="70" cy="35" r="10" fill="white"/><rect x="25" y="65" width="50" height="10" rx="5" fill="white"/></svg>`;
        const platformSVG = `<svg viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="50" fill="#a0aec0" rx="10"/></svg>`;
        const coinSVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="#f6e05e" stroke="#f6b93b" stroke-width="8"/></svg>`;
        const backgroundSVG = `<svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="1200" fill="#2d3748"/><circle cx="700" cy="150" r="50" fill="#f6e05e"/></svg>`;

        playerImage.src = 'data:image/svg+xml;base64,' + btoa(playerSVG);
        platformImage.src = 'data:image/svg+xml;base64,' + btoa(platformSVG);
        coinImage.src = 'data:image/svg+xml;base64,' + btoa(coinSVG);
        backgroundImage.src = 'data:image/svg+xml;base64,' + btoa(backgroundSVG);
        
        class Player {
            constructor() {
                this.position = { x: 100, y: 100 };
                this.velocity = { x: 0, y: 0 };
                this.width = 50;
                this.height = 50;
                this.jumpStrength = 18; // Increased jump for taller screen
                this.onGround = false;
            }
            draw() { ctx.drawImage(playerImage, this.position.x, this.position.y, this.width, this.height); }
            update() {
                this.draw();
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;
                if (this.position.y + this.height + this.velocity.y <= canvas.height) {
                    this.velocity.y += gravity;
                } else {
                    this.velocity.y = 0;
                    this.position.y = canvas.height - this.height;
                    this.onGround = true;
                }
                if (this.position.x < 0) this.position.x = 0;
                if (this.position.y > canvas.height) loseGame();
            }
        }

        class Platform {
            constructor({ x, y, width, height }) {
                this.position = { x, y };
                this.width = width;
                this.height = height;
            }
            draw() { ctx.drawImage(platformImage, this.position.x, this.position.y, this.width, this.height); }
        }

        class Coin {
            constructor({ x, y }) {
                this.position = { x, y };
                this.width = 30;
                this.height = 30;
            }
            draw() { ctx.drawImage(coinImage, this.position.x, this.position.y, this.width, this.height); }
        }
        
        function generatePlatformsAndCoins() {
            const lastPlatform = platforms[platforms.length - 1];
            const MIN_GAP = 100;
            const MAX_GAP = 250;
            const MAX_Y_CHANGE = 200;
            const MIN_WIDTH = 150;
            const MAX_WIDTH = 350;

            const newX = lastPlatform.position.x + lastPlatform.width + MIN_GAP + Math.random() * (MAX_GAP - MIN_GAP);
            let newY = lastPlatform.position.y + (Math.random() - 0.5) * MAX_Y_CHANGE * 2;
            
            if (newY > canvas.height - 100) newY = canvas.height - 100;
            if (newY < 300) newY = 300;

            const newWidth = MIN_WIDTH + Math.random() * (MAX_WIDTH - MIN_WIDTH);
            const newPlatform = new Platform({ x: newX, y: newY, width: newWidth, height: 25 });
            platforms.push(newPlatform);

            // Add a coin on the new platform
            if (Math.random() > 0.3) { // 70% chance to spawn a coin
                coins.push(new Coin({ x: newX + newWidth / 2 - 15, y: newY - 40 }));
            }
        }

        function init() {
            gameRunning = true;
            scrollOffset = 0;
            score = 0;
            updateScore(0);
            messageBox.classList.add('hidden');
            
            player = new Player();
            platforms = [ new Platform({ x: 0, y: canvas.height - 60, width: 600, height: 60 }) ];
            coins = [];
            
            while(platforms[platforms.length - 1].position.x < canvas.width) {
                 generatePlatformsAndCoins();
            }

            keys = { right: { pressed: false }, left: { pressed: false } };
            
            if (!gameRunning) animate();
        }

        function updateScore(newScore) {
             score = newScore;
             coinCountDisplay.textContent = score;
             // For desktop view, draw score on canvas
            if (window.innerWidth >= 1024) {
                 // The animate loop will handle drawing
            }
        }

        function animate() {
            if (!gameRunning) return;
            requestAnimationFrame(animate);

            ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
            
            // Draw score on canvas for desktop
             if (window.innerWidth >= 1024) {
                ctx.fillStyle = 'white';
                ctx.font = '24px "Press Start 2P"';
                ctx.fillText(`Coins: ${score}`, 20, 40);
            }

            platforms.forEach(p => p.draw());
            coins.forEach(c => c.draw());
            player.update();

            // Scrolling and player movement
            if (keys.right.pressed && player.position.x < canvas.width * 0.4) {
                player.velocity.x = 6;
            } else if (keys.left.pressed && player.position.x > 100) {
                player.velocity.x = -6;
            } else {
                player.velocity.x = 0;
                if (keys.right.pressed) {
                    scrollOffset += 6;
                    platforms.forEach(p => p.position.x -= 6);
                    coins.forEach(c => c.position.x -= 6);
                } else if (keys.left.pressed && scrollOffset > 0) {
                    scrollOffset -= 6;
                     platforms.forEach(p => p.position.x += 6);
                     coins.forEach(c => c.position.x += 6);
                }
            }

            // Platform collision
            player.onGround = false;
            platforms.forEach(p => {
                if (player.position.y + player.height <= p.position.y &&
                    player.position.y + player.height + player.velocity.y >= p.position.y &&
                    player.position.x + player.width >= p.position.x &&
                    player.position.x <= p.position.x + p.width) {
                    player.velocity.y = 0;
                    player.position.y = p.position.y - player.height;
                    player.onGround = true;
                }
            });
            
            // Coin collision
            coins.forEach((coin, index) => {
                if (player.position.x < coin.position.x + coin.width &&
                    player.position.x + player.width > coin.position.x &&
                    player.position.y < coin.position.y + coin.height &&
                    player.position.y + player.height > coin.position.y) {
                    coins.splice(index, 1);
                    updateScore(score + 1);
                }
            });
            
            // Generate new content
            if (platforms[platforms.length - 1].position.x < canvas.width) {
                generatePlatformsAndCoins();
            }
            platforms = platforms.filter(p => p.position.x + p.width > 0);
            coins = coins.filter(c => c.position.x + c.width > 0);
            
            if(score >= WINNING_SCORE) winGame();
        }
        
        function showEndScreen(title, finalScore) {
            gameRunning = false;
            winMessage.textContent = title;
            scoreMessage.textContent = `Coins Collected: ${finalScore}`;
            messageBox.classList.remove('hidden');
            setTimeout(init, 3000);
        }

        function winGame() { showEndScreen('You Win!', score); }
        function loseGame() { init(); }

        window.addEventListener('keydown', ({ key }) => {
            switch (key) {
                case 'ArrowLeft': keys.left.pressed = true; break;
                case 'ArrowRight': keys.right.pressed = true; break;
                case 'ArrowUp': case ' ': if (player.onGround) player.velocity.y = -player.jumpStrength; break;
            }
        });
        window.addEventListener('keyup', ({ key }) => {
            switch (key) {
                case 'ArrowLeft': keys.left.pressed = false; break;
                case 'ArrowRight': keys.right.pressed = false; break;
            }
        });

        const leftBtn = document.getElementById('leftBtn'), rightBtn = document.getElementById('rightBtn'), jumpBtn = document.getElementById('jumpBtn');
        function handleJump(e) { e.preventDefault(); if (player.onGround) player.velocity.y = -player.jumpStrength; }
        function handleLeftPress(e) { e.preventDefault(); keys.left.pressed = true; }
        function handleLeftRelease(e) { e.preventDefault(); keys.left.pressed = false; }
        function handleRightPress(e) { e.preventDefault(); keys.right.pressed = true; }
        function handleRightRelease(e) { e.preventDefault(); keys.right.pressed = false; }
        leftBtn.addEventListener('mousedown', handleLeftPress); leftBtn.addEventListener('touchstart', handleLeftPress);
        leftBtn.addEventListener('mouseup', handleLeftRelease); leftBtn.addEventListener('touchend', handleLeftRelease);
        leftBtn.addEventListener('mouseleave', handleLeftRelease);
        rightBtn.addEventListener('mousedown', handleRightPress); rightBtn.addEventListener('touchstart', handleRightPress);
        rightBtn.addEventListener('mouseup', handleRightRelease); rightBtn.addEventListener('touchend', handleRightRelease);
        rightBtn.addEventListener('mouseleave', handleRightRelease);
        jumpBtn.addEventListener('mousedown', handleJump); jumpBtn.addEventListener('touchstart', handleJump);

        function setCanvasResolution() {
            // Use different resolutions for different screen aspect ratios
            if (window.innerWidth < 1024) { // Mobile vertical layout
                canvas.width = 720;
                canvas.height = 1120;
            } else { // Desktop landscape layout
                canvas.width = 1280;
                canvas.height = 720;
            }
            if (player) init();
        }
        
        window.onload = () => {
             setCanvasResolution();
             init();
             animate();
        }
        window.addEventListener('resize', setCanvasResolution);
    </script>
</body>
</html>
