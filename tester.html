<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Artwork Platformer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #1a202c;
            color: #e2e8f0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .game-container {
            position: relative;
            width: 100%;
            max-width: 4xl;
            aspect-ratio: 16 / 9;
            margin-bottom: 1rem;
        }
        @media (min-width: 1024px) {
            .game-container {
                margin-bottom: 0;
                margin-right: 1rem;
            }
        }
        canvas {
            background-color: #2d3748;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .control-panel {
            background-color: #2d3748;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .file-input-label {
            background-color: #4a5568;
            color: #e2e8f0;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }
        .file-input-label:hover {
            background-color: #718096;
        }
        input[type="file"] {
            display: none;
        }
        .instructions {
            background-color: rgba(0,0,0,0.5);
            padding: 0.5rem;
            border-radius: 0.375rem;
        }
        .control-button {
            transition: all 0.1s ease;
            user-select: none; /* Prevents text selection on repeated taps */
            -webkit-user-select: none; /* Safari */
        }
        .control-button:active {
            background-color: rgba(160, 174, 192, 0.7); /* gray-500 with opacity */
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gray-900 flex flex-col lg:flex-row items-center justify-center p-4">

    <!-- Game Canvas -->
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="messageBox" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-70 text-white text-3xl hidden rounded-lg text-center p-4">
            You won!
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls" class="fixed bottom-5 left-0 right-0 flex justify-around items-center lg:hidden z-10">
        <div class="flex gap-4">
            <button id="leftBtn" class="control-button bg-gray-700 bg-opacity-50 text-white font-bold p-4 rounded-full w-20 h-20 text-4xl flex items-center justify-center">&#x2190;</button>
            <button id="rightBtn" class="control-button bg-gray-700 bg-opacity-50 text-white font-bold p-4 rounded-full w-20 h-20 text-4xl flex items-center justify-center">&#x2192;</button>
        </div>
        <button id="jumpBtn" class="control-button bg-gray-700 bg-opacity-50 text-white font-bold p-4 rounded-full w-20 h-20 text-4xl flex items-center justify-center">&#x2191;</button>
    </div>

    <!-- Controls and Uploads -->
    <div class="control-panel w-full max-w-sm">
        <h2 class="text-2xl mb-4 text-center">Game Controls</h2>
        <div class="instructions p-3 rounded-lg bg-gray-800 mb-6 text-sm">
            <p><span class="font-bold text-teal-400">Arrows/Buttons:</span> Move & Jump</p>
            <p class="mt-2">Reach the <span class="text-yellow-400">Golden Platform</span> to win!</p>
        </div>

        <h3 class="text-xl mb-3 text-center">Upload Artwork</h3>
        <div class="grid grid-cols-1 gap-4">
            <div>
                <label for="playerUpload" class="file-input-label block">Upload Player</label>
                <input type="file" id="playerUpload" accept="image/*">
            </div>
            <div>
                <label for="platformUpload" class="file-input-label block">Upload Platform</label>
                <input type="file" id="platformUpload" accept="image/*">
            </div>
            <div>
                <label for="backgroundUpload" class="file-input-label block">Upload Background</label>
                <input type="file" id="backgroundUpload" accept="image/*">
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('messageBox');

        let gameRunning = true;

        // Game settings
        const gravity = 0.6;
        let player, platforms, keys, backgroundImage;

        // Image objects
        const playerImage = new Image();
        const platformImage = new Image();
        const winPlatformImage = new Image();
        backgroundImage = new Image();

        // Default "Art" as base64 SVGs to avoid external requests
        const defaultPlayerSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#4299e1"/><circle cx="30" cy="30" r="10" fill="white"/><circle cx="70" cy="30" r="10" fill="white"/><rect x="20" y="60" width="60" height="10" fill="white" rx="5"/></svg>`;
        const defaultPlatformSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50"><rect width="200" height="50" fill="#a0aec0" rx="10"/></svg>`;
        const winPlatformSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50"><rect width="200" height="50" fill="#f6e05e" rx="10"/><path d="M100 5 L115 40 L70 18 H130 L85 40 Z" fill="#f687b3"/></svg>`;
        const defaultBackgroundSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect width="800" height="600" fill="#2d3748"/><circle cx="700" cy="100" r="50" fill="#f6e05e"/></svg>`;

        playerImage.src = 'data:image/svg+xml;base64,' + btoa(defaultPlayerSVG);
        platformImage.src = 'data:image/svg+xml;base64,' + btoa(defaultPlatformSVG);
        winPlatformImage.src = 'data:image/svg+xml;base64,' + btoa(winPlatformSVG);
        backgroundImage.src = 'data:image/svg+xml;base64,' + btoa(defaultBackgroundSVG);

        // Player Class
        class Player {
            constructor() {
                this.position = { x: 100, y: 100 };
                this.velocity = { x: 0, y: 0 };
                this.width = 50;
                this.height = 50;
                this.jumpStrength = 15;
                this.onGround = false;
            }

            draw() {
                ctx.drawImage(playerImage, this.position.x, this.position.y, this.width, this.height);
            }

            update() {
                this.draw();
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                if (this.position.y + this.height + this.velocity.y <= canvas.height) {
                    this.velocity.y += gravity;
                } else {
                    this.velocity.y = 0;
                    this.position.y = canvas.height - this.height;
                    this.onGround = true;
                }
                 // Prevent player from going off-screen horizontally
                if (this.position.x < 0) {
                    this.position.x = 0;
                }
                if (this.position.x + this.width > canvas.width) {
                    this.position.x = canvas.width - this.width;
                }
            }
        }

        // Platform Class
        class Platform {
            constructor({ x, y, width = 200, height = 20, isWinPlatform = false}) {
                this.position = { x, y };
                this.width = width;
                this.height = height;
                this.isWinPlatform = isWinPlatform;
            }

            draw() {
                const img = this.isWinPlatform ? winPlatformImage : platformImage;
                ctx.drawImage(img, this.position.x, this.position.y, this.width, this.height);
            }
        }
        
        // Game initialization
        function init() {
            gameRunning = true;
            messageBox.classList.add('hidden');
            
            player = new Player();
            platforms = [
                new Platform({ x: 0, y: canvas.height - 30, width: canvas.width * 1.5, height: 30 }),
                new Platform({ x: 200, y: canvas.height - 150 }),
                new Platform({ x: 500, y: canvas.height - 250 }),
                new Platform({ x: 850, y: canvas.height - 400 }),
                new Platform({ x: 500, y: canvas.height - 550, isWinPlatform: true }), // Win platform
            ];

            keys = {
                right: { pressed: false },
                left: { pressed: false },
            };
            
            if (!gameRunning) {
                animate();
            }
        }

        // Animation loop
        function animate() {
            if (!gameRunning) return;
            requestAnimationFrame(animate);

            // Draw background
            ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);

            platforms.forEach(platform => {
                platform.draw();
            });
            player.update();

            // Player movement
            if (keys.right.pressed && player.position.x < canvas.width - player.width) {
                player.velocity.x = 5;
            } else if (keys.left.pressed && player.position.x > 0) {
                player.velocity.x = -5;
            } else {
                player.velocity.x = 0;
            }

            // Platform collision detection
            player.onGround = false;
            platforms.forEach(platform => {
                if (
                    player.position.y + player.height <= platform.position.y &&
                    player.position.y + player.height + player.velocity.y >= platform.position.y &&
                    player.position.x + player.width >= platform.position.x &&
                    player.position.x <= platform.position.x + platform.width
                ) {
                    player.velocity.y = 0;
                    player.position.y = platform.position.y - player.height;
                    player.onGround = true;
                    if (platform.isWinPlatform) {
                       winGame();
                    }
                }
            });
        }
        
        function winGame() {
            gameRunning = false;
            messageBox.textContent = 'You Reached The Goal!';
            messageBox.classList.remove('hidden');
            setTimeout(init, 2000); // Restart after 2 seconds
        }

        // --- Event listeners for controls ---

        // Keyboard controls
        window.addEventListener('keydown', ({ key }) => {
            switch (key) {
                case 'ArrowLeft': keys.left.pressed = true; break;
                case 'ArrowRight': keys.right.pressed = true; break;
                case 'ArrowUp':
                    if (player.onGround) {
                        player.velocity.y = -player.jumpStrength;
                        player.onGround = false;
                    }
                    break;
            }
        });

        window.addEventListener('keyup', ({ key }) => {
            switch (key) {
                case 'ArrowLeft': keys.left.pressed = false; break;
                case 'ArrowRight': keys.right.pressed = false; break;
            }
        });

        // Mobile & Mouse Button Controls
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const jumpBtn = document.getElementById('jumpBtn');

        function handleJump() {
             if (player.onGround) {
                player.velocity.y = -player.jumpStrength;
                player.onGround = false;
            }
        }

        leftBtn.addEventListener('mousedown', (e) => { e.preventDefault(); keys.left.pressed = true; });
        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left.pressed = true; });
        leftBtn.addEventListener('mouseup', (e) => { e.preventDefault(); keys.left.pressed = false; });
        leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.left.pressed = false; });

        rightBtn.addEventListener('mousedown', (e) => { e.preventDefault(); keys.right.pressed = true; });
        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right.pressed = true; });
        rightBtn.addEventListener('mouseup', (e) => { e.preventDefault(); keys.right.pressed = false; });
        rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.right.pressed = false; });
        
        jumpBtn.addEventListener('mousedown', (e) => { e.preventDefault(); handleJump(); });
        jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleJump(); });

        
        // Image Upload Handlers
        document.getElementById('playerUpload').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                playerImage.src = URL.createObjectURL(e.target.files[0]);
            }
        });

        document.getElementById('platformUpload').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                platformImage.src = URL.createObjectURL(e.target.files[0]);
            }
        });
        
        document.getElementById('backgroundUpload').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                backgroundImage.src = URL.createObjectURL(e.target.files[0]);
            }
        });

        // Resize canvas and restart game
        function resizeCanvas() {
            canvas.width = 1280; // Render at a fixed resolution
            canvas.height = 720;
            // The CSS will handle the display scaling
            
            // Re-initialize the game on resize to reposition elements correctly
            if(player) init();
        }

        window.addEventListener('resize', resizeCanvas);

        // Initial setup
        window.onload = () => {
             resizeCanvas();
             init();
             animate();
        }

    </script>
</body>
</html>
