<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Successful!</title>
    <!-- Using the same retro font for a consistent experience -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #0055AA; /* Amiga blue */
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background-color: #BDBDBD;
            color: #000;
            padding: 2rem;
            border: 3px outset #FFFFFF;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.4);
            max-width: 600px;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        p {
            margin-bottom: 1.5rem;
            font-size: 0.8rem;
            line-height: 1.5;
        }
        .code-box {
            background-color: #FFF;
            border: 3px inset #888;
            padding: 1rem;
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            user-select: all; /* Make it easy to copy */
        }
        .back-button {
            display: inline-block;
            background-color: #55aa55;
            border: 3px outset #FFFFFF;
            padding: 10px 15px;
            text-decoration: none;
            color: #000;
            cursor: pointer;
        }
        .back-button:active {
            border-style: inset;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thank you for your support!</h1>
        <p>Your premium feature is unlocked. Please save this backup code. You can use it if you ever clear your browser data or switch devices.</p>
        
        <div id="code-box" class="code-box">Generating...</div>
        
        <a href="memepro.html" class="back-button">Go Back to Meme Maker</a>
    </div>

    <script>
        // This is the key step: set the "paid" flag in the browser's storage.
        localStorage.setItem('p1MemeMakerPremium', 'true');

        // --- Unlock Code Generation ---
        const codeBox = document.getElementById('code-box');
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // A-Z, 0-9, excluding confusing chars like I, O, 0, 1
        const secretKey = 'AMIGA'; // A simple secret key

        /**
         * Generates a random 4-character string from the allowed character set.
         */
        function generateRandomPart() {
            let result = '';
            for (let i = 0; i < 4; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }
        
        /**
         * Creates a 4-character checksum based on a random part and a secret key.
         * This is not cryptographically secure, but prevents simple guessing.
         */
        function generateChecksumPart(randomPart) {
            let checksum = '';
            for (let i = 0; i < 4; i++) {
                const randCharIndex = chars.indexOf(randomPart[i]);
                const keyCharIndex = chars.indexOf(secretKey[i % secretKey.length]);
                const newIndex = (randCharIndex + keyCharIndex) % chars.length;
                checksum += chars[newIndex];
            }
            return checksum;
        }

        // Generate and display the full code
        const randomPart = generateRandomPart();
        const checksumPart = generateChecksumPart(randomPart);
        const fullCode = `P1-${randomPart}-${checksumPart}`;
        
        codeBox.textContent = fullCode;

        // Also save the code to local storage so the user doesn't have to enter it on this device
        localStorage.setItem('p1MemeMakerCode', fullCode);

    </script>
</body>
</html>
