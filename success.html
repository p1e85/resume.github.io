<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Successful!</title>
    <!-- Using the same retro font for a consistent experience -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #0055AA; /* Amiga blue */
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            text-shadow: 2px 2px 0 #000000;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thank you for your support!</h1>
        <p>Your premium feature is now unlocked.</p>
        <p>Redirecting you back to the Meme Maker...</p>
    </div>

    <script>
        // This is the key step: set the "paid" flag in the browser's storage.
        localStorage.setItem('p1MemeMakerPremium', 'true');

        // Redirect the user back to the main app after a short delay.
        setTimeout(() => {
            window.location.href = 'memepro.html';
        }, 3000); // 3-second delay to allow the user to read the message.
    </script>
</body>
</html>
