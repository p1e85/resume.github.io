<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garbage Path - Map Tracker</title>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />
    <link rel="stylesheet" href="css/mapstyle.css">
</head>
<body>

    <!-- Top Bar Container -->
    <div class="top-bar-container">
        <button id="communityBtn" class="community-button off">🌎 Community View: OFF</button>
        <a href="https://www.buymeacoffee.com/p1skates" target="_blank" class="donate-button">
            ☕ Support the Mission
        </a>
    </div>

    <!-- Terms of Use Modal -->
    <div id="termsModal" class="modal-overlay">
        <!-- ... modal content ... -->
    </div>
    
    <!-- Authentication Modal -->
    <div id="authModal" class="modal-overlay">
        <!-- ... modal content ... -->
    </div>
    
    <!-- Map container -->
    <div id='map'></div>

    <!-- Bottom Container -->
    <div class="bottom-container">
        <!-- ... user status and controls ... -->
    </div>

    <!-- Data Management Modal (MODIFIED) -->
    <div id="dataModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Data Management</h2>
            <p>Save your current session to your account, or load a previous one.</p>
            <button id="saveBtn" class="modal-button">Save Private Session</button>
            <button id="loadBtn" class="modal-button">Load Private Session</button>
            <hr>
            <p>Publish your completed route to the public community map for everyone to see.</p>
            <button id="publishBtn" class="modal-button publish">🚀 Publish to Community</button>
            <hr>
            <p>Export your pins and route as a GeoJSON file.</p>
            <button id="exportBtn" class="modal-button export">Export as GeoJSON</button>
        </div>
    </div>

    <!-- JavaScript Libraries -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
    <script src="js/mapscript.js" type="module"></script>

</body>
</html>
