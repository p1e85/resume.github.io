<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Pulse Reminders</title>
    <link rel="stylesheet" href="css/liststyle.css">
</head>
<body>

    <div id="auth-overlay" class="overlay">
        <div class="auth-card">
            <h2>Daily Pulse 🕒</h2>
            <p>Track your habits, stay on time.</p>
            
            <div id="auth-form" style="display:none;">
                <input type="email" id="user-email" placeholder="Email">
                <input type="password" id="user-pass" placeholder="Password">
                <button class="btn-primary">Sign In</button>
                <div class="divider">OR</div>
            </div>

            <button class="btn-primary" onclick="app.init()">Enter App (Guest Mode)</button>
            
            <p class="legal-links">
                By using this app, you agree to our 
                <a href="#" onclick="alert('TOS: Data is stored locally on this browser.')">TOS</a> and 
                <a href="#" onclick="alert('Privacy: We do not collect or sell your local data.')">Privacy Policy</a>.
            </p>
        </div>
    </div>

    <main id="main-app" class="app-container hidden">
        <header>
            <h1>My Day 📅</h1>
            <div class="stats-bar">
                <span id="date-display"></span>
                <span id="score">Daily Score: 0%</span>
            </div>
        </header>

        <ul id="task-list"></ul>

        <nav class="bottom-nav">
            <button class="btn-primary" onclick="app.openTemplates()">+ Add Template</button>
            <button class="btn-guest" onclick="alert('History feature coming soon!')">📊 History</button>
        </nav>
    </main>

    <div id="template-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Choose a Template</h2>
            <div class="template-grid">
                <div class="template-card" onclick="app.addTemplate('morning')">
                    <span>☀️</span>
                    <h4>Morning</h4>
                </div>
                <div class="template-card" onclick="app.addTemplate('work')">
                    <span>💻</span>
                    <h4>Productivity</h4>
                </div>
                <div class="template-card" onclick="app.addTemplate('health')">
                    <span>🍎</span>
                    <h4>Wellness</h4>
                </div>
            </div>
            <button class="btn-close" onclick="app.closeTemplates()">Cancel</button>
        </div>
    </div>

    <script src="js/listapp.js"></script>
</body>
</html>
