<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO-DB 💾</title>
    <link rel="stylesheet" href="css/datastyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <h1>// RETRO-DB TERMINAL</h1>
        
        <div class="list-actions">
            <button id="editBtn" class="btn" disabled>> EDIT SELECTED (1)</button>
            <button id="deleteBtn" class="btn btn-secondary" disabled>> DELETE SELECTED</button>
            <button id="clearAllBtn" class="btn btn-secondary" disabled>> CLEAR ALL</button>
        </div>

        <div id="messageList" class="message-list">
            </div>

        <button id="createBtn" class="btn">> CREATE NEW ENTRY</button>
    </div>

    <div id="dataModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="modalTitle">NEW DATA ENTRY</h2>
            <form id="dataForm">
                <div class="form-group">
                    <label for="fileName">FILENAME:</label>
                    <input type="text" id="fileName" name="fileName" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="subject">SUBJECT:</label>
                    <input type="text" id="subject" name="subject" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="message">MESSAGE:</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="submit" id="saveBtn" class="btn">> SAVE & DOWNLOAD</button>
                    <button type="button" id="cancelBtn" class="btn btn-secondary">> CANCEL</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/datascript.js"></script>
</body>
</html>
