    <title>Retro-DB: Your Private, Local-First Notes App</title>

    <meta name="keywords" content="local notes, private database, retro text editor, offline notes, secure notes, 80s aesthetic, no-cloud app">
    <link rel="canonical" href="https://your-website-url.com/"> <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-website-url.com/"> <meta property="og:title" content="Retro-DB: Your Private 80s-Style Notes Terminal">
    <meta property="og:description" content="Save notes directly to your device with a classic terminal aesthetic. No cloud, no sign-ups, no tracking.">
    <meta property="og:image" content="https://your-website-url.com/preview-image.png"> <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://your-website-url.com/"> <meta property="twitter:title" content="Retro-DB: Your Private 80s-Style Notes Terminal">
    <meta property="twitter:description" content="Save notes directly to your device with a classic terminal aesthetic. No cloud, no sign-ups, no tracking.">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <div class="scanlines"></div>
    <div class="container">
        <div class="header">
            <h1>// RETRO-DB TERMINAL</h1>
            <div class="header-buttons">
                <button id="supportBtn" class="btn btn-small btn-secondary">> SUPPORT <3</button>
                <button id="infoBtn" class="btn btn-small">> INFO (?)</button>
                <button id="themeToggleBtn" class="btn btn-small">> CHANGE THEME</button>
            </div>
        </div>

        <div class="list-actions">
            <button id="editBtn" class="btn" disabled>> EDIT SELECTED (1)</button>
            <button id="downloadBtn" class="btn" disabled>> DOWNLOAD SELECTED</button> 
            <button id="deleteBtn" class="btn btn-secondary" disabled>> DELETE SELECTED</button>
            <button id="clearAllBtn" class="btn btn-secondary" disabled>> CLEAR ALL</button>
        </div>

        <div id="messageList" class="message-list">
            </div>

        <button id="createBtn" class="btn">> CREATE NEW ENTRY</button>
    </div>

    <div id="dataModal" class="modal-overlay hidden">
        </div>

    <div id="infoModal" class="modal-overlay hidden">
        </div>

    <div id="supportModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>SUPPORT THIS PROJECT</h2>
            <p>If you find this tool useful, please consider supporting its development. Your contribution helps keep this project ad-free and allows for future updates and features!</p>
            
            <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
                <input type="hidden" name="cmd" value="_s-xclick" />
                <input type="hidden" name="hosted_button_id" value="V96ZQKQJMTD3U" />
                <button type="submit" class="btn">> DONATE WITH PAYPAL</button>
            </form>

            <div class="modal-actions">
                <button type="button" id="closeSupportBtn" class="btn btn-secondary">> CLOSE</button>
            </div>
        </div>
    </div>

    <script src="js/datascript.js"></script>
</body>
</html>
