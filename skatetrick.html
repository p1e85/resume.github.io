<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Skate Trick Tracker</title>
  
  <link rel="stylesheet" href="css/trickstyles.css" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="data:application/manifest+json,{
    &quot;name&quot;:&quot;Skate Trick Tracker&quot;,
    &quot;short_name&quot;:&quot;Skate Trick&quot;,
    &quot;start_url&quot;:&quot;.&quot;,
    &quot;display&quot;:&quot;standalone&quot;,
    &quot;background_color&quot;:&quot;#111111&quot;,
    &quot;theme_color&quot;:&quot;#ccff00&quot;,
    &quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛼%3C/text%3E%3C/svg%3E&quot;,&quot;sizes&quot;:&quot;96x96&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]
  }">
</head>
<body>

  <main class="app-container">
    <header>
      <h1>SKATE TRICK</h1>
      <p class="subtitle">Motion Tracker</p>
    </header>

    <div class="stance-container">
      <button class="stance-btn active" id="regularBtn">Regular</button>
      <button class="stance-btn" id="goofyBtn">Goofy</button>
    </div>

    <div class="action-area">
      <button id="startBtn" class="primary-btn">START TRACKING</button>
      <div id="output" class="trick-display">Hold & flip!</div>
    </div>

    <div class="history-section">
      <h2>Session History</h2>
      <div id="history" class="history-list"></div>
    </div>

    <div id="installPrompt" class="install-prompt">
      <span>Share &rarr; Add to Home Screen</span>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
