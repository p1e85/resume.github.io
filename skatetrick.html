<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skate Trick Detector</title>

  <!-- PWA Manifest (inline) -->
  <link rel="manifest" href="data:application/manifest+json,{
    %22name%22:%22Skate%20Trick%20Detector%22,
    %22short_name%22:%22SkateTricks%22,
    %22start_url%22:%22.%22,
    %22display%22:%22standalone%22,
    %22background_color%22:%22%23000000%22,
    %22theme_color%22:%22%2300d4ff%22,
    %22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3Eskateboard%3C/text%3E%3C/svg%3E%22,%22sizes%22:%2296x96%22,%22type%22:%22image/svg+xml%22}]
  }">

  <style>
    :root{
      --bg:#111;--text:#fff;--accent:#00d4ff;--card:#222;
      --success:#0f0;--warn:#ff0;--danger:#f55;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:var(--bg);color:var(--text);
      font-family:'Segoe UI',sans-serif;
      text-align:center;padding:2rem 1rem;
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;
    }
    h1{font-size:2.5rem;margin-bottom:1rem;color:var(--accent);}
    .stance{margin:1.5rem 0;}
    button{
      background:var(--card);color:#fff;border:2px solid var(--accent);
      padding:.8rem 1.5rem;margin:.5rem;font-size:1.2rem;
      border-radius:12px;cursor:pointer;transition:.2s;
    }
    button:hover{background:var(--accent);color:#000;}
    button.active{background:var(--accent);color:#000;font-weight:bold;}
    #startBtn{background:#000;font-size:1.5rem;padding:1rem 2rem;margin-top:2rem;}
    #output{margin-top:2rem;font-size:1.8rem;min-height:3rem;font-weight:bold;color:var(--success);}
    .info{margin-top:2rem;font-size:.9rem;color:#aaa;max-width:600px;}
    .install{margin-top:1rem;padding:1rem;background:var(--warn);color:#000;border-radius:8px;font-weight:bold;display:none;}
    #history{
      margin-top:2rem;width:90%;max-width:500px;background:var(--card);
      border-radius:12px;padding:1rem;max-height:200px;overflow-y:auto;
    }
    .trick{
      padding:.5rem 0;border-bottom:1px solid #444;
      display:flex;justify-content:space-between;font-size:1rem;
    }
    .trick:last-child{border:none;}
  </style>
</head>
<body>

  <h1>Skate Trick Detector</h1>

  <div class="stance">
    <p>Select your stance:</p>
    <button id="regularBtn">Regular</button>
    <button id="goofyBtn">Goofy</button>
  </div>

  <button id="startBtn">Start Detecting Tricks</button>

  <div id="output">Hold phone like a skateboard & flip it!</div>

  <div id="history"></div>

  <div class="info">
    <p>Tip: Add to Home Screen for best results (especially iPhone)</p>
    <div id="installPrompt" class="install">Tap Share → "Add to Home Screen"</div>
  </div>

  <script>
    // ==== State ====
    const MAX_HISTORY = 10;
    let stance = 'regular';               // regular / goofy
    let isDetecting = false;
    let history = [];                     // {trick, time}
    let lastEventTime = 0;
    let current = {
      axis: null,          // 'beta' (flip) or 'alpha' (shuv)
      startTime: 0,
      rotSum: 0,           // accumulated signed rotation (deg)
      pop: false
    };

    // DOM
    const regularBtn = document.getElementById('regularBtn');
    const goofyBtn   = document.getElementById('goofyBtn');
    const startBtn   = document.getElementById('startBtn');
    const output     = document.getElementById('output');
    const historyDiv = document.getElementById('history');
    const installPrompt = document.getElementById('installPrompt');

    // ==== UI Helpers ====
    regularBtn.onclick = () => { stance = 'regular'; updateStance(); };
    goofyBtn.onclick   = () => { stance = 'goofy';   updateStance(); };
    function updateStance(){
      regularBtn.classList.toggle('active', stance==='regular');
      goofyBtn.classList.toggle('active',   stance==='goofy');
    }

    function addToHistory(trick){
      const now = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
      history.unshift({trick, time:now});
      if(history.length>MAX_HISTORY) history.pop();
      renderHistory();
    }
    function renderHistory(){
      historyDiv.innerHTML = history.map(h=>`
        <div class="trick"><span>${h.trick}</span><span>${h.time}</span></div>
      `).join('');
    }

    // ==== Start ====
    startBtn.onclick = async () => {
      if(isDetecting) return;
      if(typeof DeviceMotionEvent.requestPermission === 'function'){
        const resp = await DeviceMotionEvent.requestPermission();
        if(resp!=='granted'){
          output.textContent = "Permission denied";
          output.style.color = '#f55';
          return;
        }
      }
      isDetecting = true;
      startBtn.textContent = "Detecting…";
      startBtn.disabled = true;
      output.textContent = "Ready! Try a trick.";
      output.style.color = '#fff';
      if(/iPhone|iPad|iPod/.test(navigator.userAgent)) installPrompt.style.display='block';

      window.addEventListener('devicemotion', onMotion);
    };

    // ==== Motion Handler ====
    function onMotion(e){
      const rot = e.rotationRate;
      const acc = e.accelerationIncludingGravity;
      if(!rot) return;

      const now = Date.now();
      const dt = now - (lastEventTime||now);
      lastEventTime = now;

      // ---- Pop detection (quick upward spike) ----
      if(acc && acc.z > 12) current.pop = true;

      // ---- Choose dominant axis ----
      const a = rot.alpha||0, b = rot.beta||0, g = rot.gamma||0;
      const absA = Math.abs(a), absB = Math.abs(b);

      let newAxis = null;
      if(absB > 80) newAxis = 'beta';      // flip axis
      else if(absA > 80) newAxis = 'alpha'; // shuv axis

      // ---- Start new gesture ----
      if(newAxis && !current.axis){
        current.axis = newAxis;
        current.startTime = now;
        current.rotSum = 0;
        current.pop = false;
      }

      // ---- Accumulate signed rotation while axis matches ----
      if(newAxis===current.axis){
        const degPerSec = current.axis==='beta' ? b : a;   // signed!
        current.rotSum += degPerSec * (dt/1000);
      }

      // ---- End gesture when rotation drops for 300 ms ----
      if(current.axis && (now - lastEventTime > 300)){
        finalizeTrick();
      }
    }

    // ==== Finalize & Classify ====
    function finalizeTrick(){
      if(!current.axis) return;
      const totalDeg = Math.abs(current.rotSum);
      const direction = current.rotSum > 0 ? 1 : -1;   // + = CCW, - = CW (from phone view)
      const full = totalDeg > 300;                     // ~360°
      const threeQuarter = totalDeg > 220;
      const half = totalDeg > 140;                     // ~180°
      const quarter = totalDeg > 70;

      let trick = "Unknown";

      // ---------- FLIP AXIS (beta) ----------
      if(current.axis==='beta'){
        if(full){
          // Kickflip vs Heelflip depends on stance + direction
          const isKick = (stance==='regular' && direction<0) || (stance==='goofy' && direction>0);
          trick = isKick ? "Kickflip" : "Heelflip";
        }else if(threeQuarter){
          const isKick = (stance==='regular' && direction<0) || (stance==='goofy' && direction>0);
          trick = isKick ? "Varial Kickflip" : "Varial Heelflip";
        }else if(half){
          trick = "Half‑Flip";
        }else if(current.pop){
          trick = "Impossible";
        }
      }

      // ---------- SHUV AXIS (alpha) ----------
      else if(current.axis==='alpha'){
        if(full){
          trick = current.pop ? "360 Flip (Trey)" : "360 Shuvit";
        }else if(half){
          trick = "180 Shuvit";
        }else if(quarter){
          trick = "Pop Shuvit";
        }
      }

      // ---------- OLLIE ----------
      if(!trick.includes("Shuvit") && !trick.includes("Flip") && current.pop){
        trick = "Ollie";
      }

      // ---- Feedback ----
      output.textContent = `${trick}!`;
      output.style.color = '#0f0';
      addToHistory(trick);

      setTimeout(()=>{
        if(isDetecting){
          output.textContent = "Ready for next trick…";
          output.style.color = '#fff';
        }
      },2000);

      // reset
      current = {axis:null, startTime:0, rotSum:0, pop:false};
    }

    // ==== Init ====
    updateStance();
    renderHistory();
  </script>
</body>
</html>
