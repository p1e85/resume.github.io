<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vertical Skate Trick Detector</title>

  <!-- PWA manifest (inline) -->
  <link rel="manifest" href="data:application/manifest+json,{
    %22name%22:%22Vertical Skate Trick%22,
    %22short_name%22:%22Skate%22,
    %22start_url%22:%22.%22,
    %22display%22:%22standalone%22,
    %22background_color%22:%22%23000000%22,
    %22theme_color%22:%22%23ff5a00%22,
    %22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='80'%3Eskateboard%3C/text%3E%3C/svg%3E%22,%22sizes%22:%2296x96%22,%22type%22:%22image/svg+xml%22}]
  }">

  <style>
    :root{
      --grip:#111;--grip-dot:#222;--wood:#c96;--bolt:#444;
      --accent:#ff5a00;--text:#fff;--shadow:#0006;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--text);}

    body{
      background:#000;
      display:flex;justify-content:center;align-items:center;
      padding:1rem;
    }

    /* ---------- VERTICAL DECK ---------- */
    .deck{
      width:260px;
      background:var(--wood);
      border-radius:30px 30px 20px 20px;
      box-shadow:
        0 12px 30px var(--shadow),
        inset 0 -6px 12px #a55,
        inset 0 6px 12px #da8;
      position:relative;
      overflow:hidden;
    }
    .deck::before{
      content:'';position:absolute;top:0;left:0;right:0;height:70px;
      background:
        radial-gradient(circle at 20% 30%, var(--grip-dot) 2px, transparent 2px),
        radial-gradient(circle at 80% 70%, var(--grip-dot) 2px, transparent 2px),
        linear-gradient(45deg, var(--grip) 25%, transparent 25%),
        linear-gradient(-45deg, var(--grip) 25%, transparent 25%),
        var(--grip);
      background-size:20px 20px,20px 20px,4px 4px,4px 4px;
    }

    /* truck bolts */
    .bolt{
      position:absolute;width:12px;height:12px;
      background:var(--bolt);border-radius:50%;
      box-shadow:0 0 4px #0008;
    }
    .bolt:nth-child(1){top:80px;left:30px;}
    .bolt:nth-child(2){top:80px;right:30px;}
    .bolt:nth-child(3){bottom:80px;left:30px;}
    .bolt:nth-child(4){bottom:80px;right:30px;}

    .content{
      padding:90px 20px 30px;
      text-align:center;
    }
    h1{
      font-size:1.9rem;color:#222;text-shadow:0 1px #fff;
      margin-bottom:.8rem;
    }

    /* buttons */
    button{
      background:var(--wood);color:#222;
      border:3px solid var(--bolt);border-radius:12px;
      padding:.6rem 1rem;margin:.3rem;font-weight:bold;
      font-size:1rem;cursor:pointer;transition:.2s;
      box-shadow:0 3px 6px var(--shadow);
      position:relative;
    }
    button::before,button::after{
      content:'';position:absolute;width:6px;height:6px;
      background:var(--bolt);border-radius:50%;top:.3rem;
    }
    button::before{left:.3rem;}
    button::after{right:.3rem;}
    button:hover{background:#da8;transform:translateY(-2px);}
    button.active{background:var(--accent);color:#fff;border-color:#c40;}
    #startBtn{
      font-size:1.3rem;padding:.9rem 1.8rem;margin-top:1.2rem;
      background:#222;color:var(--accent);border-color:var(--accent);
    }
    #startBtn:hover{background:var(--accent);color:#222;}

    #output{
      margin-top:.8rem;font-size:1.5rem;font-weight:bold;
      min-height:2rem;color:var(--accent);text-shadow:0 1px #000;
    }

    #history{
      margin-top:1rem;width:100%;background:var(--wood);
      border-radius:12px;padding:.8rem;
      max-height:140px;overflow-y:auto;
      box-shadow:inset 0 2px 6px #a55;
    }
    .trick{
      padding:.3rem 0;display:flex;justify-content:space-between;
      font-size:.9rem;border-bottom:1px solid #a55;
    }
    .trick:last-child{border:none;}
    .trick span:first-child{font-weight:bold;color:#222;}
    .trick span:last-child{color:#555;font-size:.8rem;}

    .info{
      margin-top:1rem;font-size:.8rem;color:#bbb;
    }
    .install{
      margin-top:.6rem;padding:.6rem;background:#ff0;color:#000;
      border-radius:8px;font-weight:bold;display:none;
    }
  </style>
</head>
<body>

  <div class="deck">
    <div class="bolt"></div><div class="bolt"></div><div class="bolt"></div><div class="bolt"></div>
    <div class="content">

      <h1>Vertical Skate</h1>

      <div class="stance">
        <p style="color:#222;margin-bottom:.4rem;">Stance:</p>
        <button id="regularBtn">Regular</button>
        <button id="goofyBtn">Goofy</button>
      </div>

      <button id="startBtn">Start Detecting</button>

      <div id="output">Hold phone upright & flip!</div>

      <div id="history"></div>

      <div class="info">
        <p>Add to Home Screen (iPhone required)</p>
        <div id="installPrompt" class="install">Share → Add to Home Screen</div>
      </div>

    </div>
  </div>

  <script>
    // ==== State ====
    const MAX_HISTORY = 10;
    let stance = 'regular';
    let isDetecting = false;
    let history = [];

    // motion state
    let motion = {
      axis: null,          // 'beta' (flip) or 'alpha' (shuv)
      start: 0,
      rotSum: 0,           // signed degrees
      pop: false,
      lastRotTime: 0       // timestamp of last high rotation
    };

    // DOM
    const regularBtn = document.getElementById('regularBtn');
    const goofyBtn   = document.getElementById('goofyBtn');
    const startBtn   = document.getElementById('startBtn');
    const output     = document.getElementById('output');
    const historyDiv = document.getElementById('history');
    const install    = document.getElementById('installPrompt');

    // ==== UI ====
    regularBtn.onclick = () => { stance='regular'; updateStance(); };
    goofyBtn.onclick   = () => { stance='goofy';   updateStance(); };
    function updateStance(){
      regularBtn.classList.toggle('active',stance==='regular');
      goofyBtn.classList.toggle('active',stance==='goofy');
    }

    function addHistory(trick){
      const t = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      history.unshift({trick,time:t});
      if(history.length>MAX_HISTORY) history.pop();
      historyDiv.innerHTML = history.map(h=>`
        <div class="trick"><span>${h.trick}</span><span>${h.time}</span></div>
      `).join('');
    }

    // ==== Start ====
    startBtn.onclick = async () => {
      if(isDetecting) return;
      if(typeof DeviceMotionEvent.requestPermission==='function'){
        const r = await DeviceMotionEvent.requestPermission();
        if(r!=='granted'){ output.textContent='Permission denied'; output.style.color='#f55'; return; }
      }
      isDetecting=true;
      startBtn.textContent='Detecting…';
      startBtn.disabled=true;
      output.textContent='Ready – try a trick!';
      output.style.color=var(--accent);
      if(/iPhone|iPad|iPod/.test(navigator.userAgent)) install.style.display='block';
      window.addEventListener('devicemotion', onMotion);
    };

    // ==== Motion ====
    function onMotion(e){
      const rot = e.rotationRate, acc = e.accelerationIncludingGravity;
      if(!rot) return;
      const now = Date.now();

      // pop
      if(acc && acc.z>12) motion.pop = true;

      const a = rot.alpha||0, b = rot.beta||0;
      const absA = Math.abs(a), absB = Math.abs(b);
      let newAxis = null;
      if(absB>80) newAxis='beta';
      else if(absA>80) newAxis='alpha';

      // start new gesture
      if(newAxis && !motion.axis){
        motion.axis = newAxis;
        motion.start = now;
        motion.rotSum = 0;
        motion.pop = false;
        motion.lastRotTime = now;
        return;
      }

      // accumulate while same axis
      if(newAxis===motion.axis){
        const degSec = motion.axis==='beta'?b:a;
        const dt = now - motion.lastRotTime;
        motion.rotSum += degSec * (dt/1000);
        motion.lastRotTime = now;
      }

      // end detection after 300 ms of low rotation
      if(motion.axis && (now - motion.lastRotTime > 300)){
        finalize();
      }
    }

    // ==== Finalize ====
    function finalize(){
      if(!motion.axis) return;
      const totalDeg = Math.abs(motion.rotSum);
      const dir = motion.rotSum>0?1:-1;   // + CCW, - CW
      const full=totalDeg>300, threeQ=totalDeg>220, half=totalDeg>140, quarter=totalDeg>70;
      let trick = 'Unknown';

      if(motion.axis==='beta'){
        if(full){
          const kick = (stance==='regular'&&dir<0)||(stance==='goofy'&&dir>0);
          trick = kick?'Kickflip':'Heelflip';
        }else if(threeQ){
          const kick = (stance==='regular'&&dir<0)||(stance==='goofy'&&dir>0);
          trick = kick?'Varial Kickflip':'Varial Heelflip';
        }else if(half) trick='Half‑Flip';
        else if(motion.pop) trick='Impossible';
      }else if(motion.axis==='alpha'){
        if(full) trick=motion.pop?'360 Flip (Trey)':'360 Shuvit';
        else if(half) trick='180 Shuvit';
        else if(quarter) trick='Pop Shuvit';
      }
      if(!trick.includes('Shuvit') && !trick.includes('Flip') && motion.pop) trick='Ollie';

      output.textContent = `${trick}!`;
      output.style.color = '#0f0';
      addHistory(trick);
      setTimeout(()=>{ if(isDetecting){ output.textContent='Ready for next…'; output.style.color=var(--accent); }},2000);

      // reset
      motion = {axis:null,start:0,rotSum:0,pop:false,lastRotTime:0};
    }

    // Init
    updateStance();
  </script>
</body>
</html>
