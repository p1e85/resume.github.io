<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FlipSense</title>

  <!-- PWA -->
  <link rel="manifest" href="data:application/manifest+json,{
    \"name\":\"FlipSense\",\"short_name\":\"FlipSense\",
    \"start_url\":\".\",\"display\":\"standalone\",
    \"background_color\":\"#000\",\"theme_color\":\"#ff3b30\",
    \"icons\":[{\"src\":\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3Eskateboard%3C/text%3E%3C/svg%3E\",\"sizes\":\"96x96\",\"type\":\"image/svg+xml\"}]
  }">

  <style>
    :root {
      --grip: #111;
      --wood: #d4a574;
      --truck: #555;
      --wheel: #222;
      --accent: #ff3b30;
      --text: #fff;
      --shadow: rgba(0,0,0,0.6);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; background:#000; font-family: 'Helvetica Neue', sans-serif; color:var(--text); overflow:hidden; }
    body { display:flex; justify-content:center; align-items:center; }

    /* ===== SKATEBOARD DECK ===== */
    .deck {
      width: 300px;
      height: 780px;
      background: var(--wood);
      border-radius: 40px 40px 30px 30px;
      position: relative;
      box-shadow: 
        0 20px 40px var(--shadow),
        inset 0 -8px 16px #b8860b,
        inset 0 8px 16px #f4d03f;
      overflow: hidden;
    }

    /* Grip Tape */
    .grip {
      position: absolute;
      top: 0; left: 0; right: 0; height: 140px;
      background:
        radial-gradient(circle at 25% 40%, #222 3px, transparent 3px),
        radial-gradient(circle at 75% 60%, #222 3px, transparent 3px),
        linear-gradient(45deg, var(--grip) 30%, #1a1a1a 30%, #1a1a1a 50%, var(--grip) 50%, var(--grip) 70%, #1a1a1a 70%),
        var(--grip);
      background-size: 30px 30px, 30px 30px, 8px 8px;
    }

    /* Truck Bolts */
    .bolt {
      position: absolute;
      width: 14px; height: 14px;
      background: var(--truck);
      border-radius: 50%;
      box-shadow: 0 0 6px #000;
    }
    .bolt:nth-child(1) { top: 160px; left: 40px; }
    .bolt:nth-child(2) { top: 160px; right: 40px; }
    .bolt:nth-child(3) { bottom: 160px; left: 40px; }
    .bolt:nth-child(4) { bottom: 160px; right: 40px; }

    /* Wheels (decorative) */
    .wheel {
      position: absolute;
      width: 50px; height: 50px;
      background: var(--wheel);
      border-radius: 50%;
      bottom: 100px;
    }
    .wheel.left { left: 30px; }
    .wheel.right { right: 30px; }

    /* ===== CONTENT ===== */
    .content {
      position: absolute;
      top: 180px; left: 0; right: 0;
      padding: 0 30px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #222;
      text-shadow: 0 1px #fff;
      margin-bottom: 1rem;
    }

    .stance {
      margin: 1.5rem 0;
    }

    .stance-btn {
      background: #222;
      color: white;
      border: 3px solid var(--truck);
      padding: 12px 24px;
      margin: 0 8px;
      border-radius: 16px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 90px;
    }
    .stance-btn.active {
      background: var(--accent);
      color: white;
      border-color: #c00;
      transform: scale(1.05);
    }

    #startBtn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 16px 32px;
      margin: 2rem 0;
      border-radius: 25px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(255,59,48,0.4);
      transition: all 0.2s;
    }
    #startBtn:active { transform: scale(0.95); }

    #output {
      margin: 1.5rem 0;
      font-size: 1.8rem;
      font-weight: bold;
      min-height: 2.5rem;
      color: var(--accent);
    }

    #history {
      margin-top: 1rem;
      background: rgba(0,0,0,0.3);
      border-radius: 16px;
      padding: 12px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 0.95rem;
    }
    .trick {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .trick:last-child { border: none; }

    .info {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #aaa;
    }
    .install {
      margin-top: 8px;
      padding: 8px;
      background: #ff0;
      color: #000;
      border-radius: 8px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <div class="deck">
    <div class="grip"></div>
    <div class="bolt"></div><div class="bolt"></div><div class="bolt"></div><div class="bolt"></div>
    <div class="wheel left"></div><div class="wheel right"></div>

    <div class="content">
      <h1>FlipSense</h1>

      <div class="stance">
        <button class="stance-btn active" id="regularBtn">Regular</button>
        <button class="stance-btn" id="goofyBtn">Goofy</button>
      </div>

      <button id="startBtn">START TRACKING</button>

      <div id="output">Hold phone like a board</div>

      <div id="history"></div>

      <div class="info">
        <p>Add to Home Screen for full sensor access</p>
        <div id="installPrompt" class="install">Share → Add to Home Screen</div>
      </div>
    </div>
  </div>

  <script>
    // ===== STATE =====
    let stance = 'regular';
    let isTracking = false;
    let history = [];
    const MAX_HISTORY = 10;

    // Motion state
    let motion = {
      active: false,
      axis: null,
      startTime: 0,
      rotSum: 0,
      pop: false,
      lastHighRot: 0
    };

    // DOM
    const regularBtn = document.getElementById('regularBtn');
    const goofyBtn = document.getElementById('goofyBtn');
    const startBtn = document.getElementById('startBtn');
    const output = document.getElementById('output');
    const historyEl = document.getElementById('history');
    const installPrompt = document.getElementById('installPrompt');

    // ===== STANCE =====
    regularBtn.onclick = () => { stance = 'regular'; updateStance(); };
    goofyBtn.onclick = () => { stance = 'goofy'; updateStance(); };
    function updateStance() {
      regularBtn.classList.toggle('active', stance === 'regular');
      goofyBtn.classList.toggle('active', stance === 'goofy');
    }

    // ===== HISTORY =====
    function addToHistory(trick) {
      const time = new Date().toLocaleTimeString('en', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      history.unshift({ trick, time });
      if (history.length > MAX_HISTORY) history.pop();
      renderHistory();
    }
    function renderHistory() {
      historyEl.innerHTML = history.map(h => `
        <div class="trick">
          <span>${h.trick}</span>
          <span>${h.time}</span>
        </div>
      `).join('');
    }

    // ===== START TRACKING =====
    startBtn.onclick = async () => {
      if (isTracking) return;

      // iOS permission
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        const response = await DeviceMotionEvent.requestPermission();
        if (response !== 'granted') {
          output.textContent = 'Permission denied';
          output.style.color = '#f55';
          return;
        }
      }

      isTracking = true;
      startBtn.textContent = 'TRACKING...';
      startBtn.disabled = true;
      output.textContent = 'Ready! Try a flip';
      output.style.color = '#fff';

      if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
        installPrompt.style.display = 'block';
      }

      window.addEventListener('devicemotion', handleMotion);
    };

    // ===== MOTION HANDLER =====
    function handleMotion(event) {
      const { rotationRate, accelerationIncludingGravity } = event;
      if (!rotationRate) return;

      const now = Date.now();
      const alpha = rotationRate.alpha || 0;
      const beta = rotationRate.beta || 0;
      const gamma = rotationRate.gamma || 0;

      // Detect pop (ollie)
      if (accelerationIncludingGravity && accelerationIncludingGravity.z > 12) {
        motion.pop = true;
      }

      const absAlpha = Math.abs(alpha);
      const absBeta = Math.abs(beta);

      let dominantAxis = null;
      if (absBeta > 90) dominantAxis = 'beta';   // flip
      else if (absAlpha > 90) dominantAxis = 'alpha'; // shuv

      // Start new motion
      if (dominantAxis && !motion.active) {
        motion.active = true;
        motion.axis = dominantAxis;
        motion.startTime = now;
        motion.rotSum = 0;
        motion.pop = false;
        motion.lastHighRot = now;
        return;
      }

      // Accumulate rotation (signed)
      if (dominantAxis === motion.axis) {
        const rate = motion.axis === 'beta' ? beta : alpha;
        const dt = now - motion.lastHighRot;
        motion.rotSum += rate * (dt / 1000);
        motion.lastHighRot = now;
      }

      // End motion after 350ms of low rotation
      if (motion.active && (now - motion.lastHighRot > 350)) {
        classifyTrick();
      }
    }

    // ===== CLASSIFY TRICK =====
    function classifyTrick() {
      if (!motion.active) return;

      const totalDeg = Math.abs(motion.rotSum);
      const direction = motion.rotSum > 0 ? 1 : -1; // + = CCW, - = CW
      const full = totalDeg > 320;
      const threeQ = totalDeg > 240;
      const half = totalDeg > 150;
      const quarter = totalDeg > 80;

      let trick = 'Ollie';

      if (motion.axis === 'beta') { // FLIP
        if (full) {
          const isKickflip = (stance === 'regular' && direction < 0) || (stance === 'goofy' && direction > 0);
          trick = isKickflip ? 'Kickflip' : 'Heelflip';
        } else if (threeQ) {
          const isKickflip = (stance === 'regular' && direction < 0) || (stance === 'goofy' && direction > 0);
          trick = isKickflip ? 'Varial Kickflip' : 'Varial Heelflip';
        } else if (motion.pop) {
          trick = 'Impossible';
        }
      } else if (motion.axis === 'alpha') { // SHUV
        if (full) {
          trick = motion.pop ? '360 Flip' : '360 Shuvit';
        } else if (half) {
          trick = '180 Shuvit';
        } else if (quarter) {
          trick = 'Shuvit';
        }
      }

      if (motion.pop && totalDeg < 100) trick = 'Ollie';

      // Feedback
      output.textContent = trick;
      output.style.color = '#0f0';
      addToHistory(trick);

      setTimeout(() => {
        if (isTracking) {
          output.textContent = 'Ready...';
          output.style.color = '#fff';
        }
      }, 1800);

      // Reset
      motion = { active: false, axis: null, startTime: 0, rotSum: 0, pop: false, lastHighRot: 0 };
    }

    // Init
    updateStance();
    renderHistory();
  </script>
</body>
</html>
