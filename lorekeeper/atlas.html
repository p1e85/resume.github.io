<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoreKeeper - Atlas</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <button id="sidebar-toggle">☰ Menu</button>
    <div id="sidebar">
        <a href="index.html">Home</a>
        <a href="wiki.html">Wiki</a>
        <a href="timeline.html">Timeline</a>
        <a href="relationships.html">Relationships</a>
        <a href="atlas.html">Atlas</a>
    </div>
    <header>
        <h1>LoreKeeper Atlas</h1>
    </header>
    <main>
        <section>
            <h2>Add Pin</h2>
            <form id="pin-form">
                <select id="pin-entry" required>
                    <!-- Populated dynamically -->
                </select>
                <input type="number" id="pin-lat" placeholder="Latitude (e.g., 51.51)" step="0.01" required>
                <input type="number" id="pin-lng" placeholder="Longitude (e.g., -0.08)" step="0.01" required>
                <textarea id="pin-description" placeholder="Pin Description" required></textarea>
                <button type="submit">Add Pin</button>
            </form>
        </section>
        <section>
            <h2>World Atlas</h2>
            <div id="atlas" style="height: 500px;"></div>
        </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/data.js"></script>
    <script src="js/atlas.js"></script>
    <script src="js/sidebar.js"></script>
</body>
</html>
