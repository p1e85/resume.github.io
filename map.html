<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garbage Path - Map Tracker</title>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />
    <link rel="stylesheet" href="css/mapstyle.css">
</head>
<body>

    <!-- Donate Button (Top-Right) -->
    <a href="https://www.buymeacoffee.com/p1skates" target="_blank" class="donate-button">
        ☕ Support the Mission
    </a>

    <!-- Terms of Use Modal -->
    <div id="termsModal" class="modal-overlay">
        <!-- ... modal content ... -->
    </div>
    
    <!-- Authentication Modal -->
    <div id="authModal" class="modal-overlay">
        <!-- ... modal content ... -->
    </div>
    
    <!-- Map container -->
    <div id='map'></div>

    <!-- NEW: Container for all bottom elements -->
    <div class="bottom-container">
        <!-- User Status Display (Moved here from top) -->
        <div id="userStatus" class="user-status-display">
            <span id="userEmail"></span>
            <button id="logoutBtn">Log Out</button>
        </div>

        <!-- Main UI controls -->
        <div class="controls">
            <button id="findMeBtn">📍 Find Me</button>
            <button id="trackBtn">🛰️ Start Tracking</button>
            <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display: none;">
            <button id="pictureBtn">📸 Pin Picture</button>
            <button id="dataBtn">💾 Data</button>
        </div>
    </div>

    <!-- Data Management Modal -->
    <div id="dataModal" class="modal">
        <!-- ... modal content ... -->
    </div>

    <!-- JavaScript Libraries -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
    <script src="js/mapscript.js" type="module"></script>

</body>
</html>
